name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  website:
    name: Chinese website browser checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install browser test dependencies
        run: |
          npm install --prefix "$RUNNER_TEMP/website-tests" playwright@1.63.0
          "$RUNNER_TEMP/website-tests/node_modules/.bin/playwright" install --with-deps chromium
      - name: Check the static website
        env:
          NODE_PATH: ${{ runner.temp }}/website-tests/node_modules
          WEBSITE_SCREENSHOTS: ${{ runner.temp }}/website-screenshots
        run: |
          python -m http.server 8765 --bind 127.0.0.1 --directory docs > "$RUNNER_TEMP/website-server.log" 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid"' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/ > /dev/null; then break; fi
            sleep 1
          done
          node tools/test_website.cjs
          node tools/test_showcase.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: website-screenshots
          path: ${{ runner.temp }}/website-screenshots

  test:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install perception_core (test extras)
        run: pip install ./src/perception_core[test]
      - name: Require the native backend
        run: python -c 'from perception_core.common.iou import resolve_iou_backend; assert resolve_iou_backend("auto") == "cpp"'
      - name: Run pytest with coverage
        run: |
          pytest src/perception_core/tests -q \
            --cov=perception_core --cov-report=term-missing --cov-report=xml
      - name: Upload coverage
        if: matrix.python-version == '3.11'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  pure-python:
    name: installation without native extension
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install the Python fallback
        run: PERCEPTION_CORE_NO_NATIVE=1 pip install ./src/perception_core[test]
      - name: Require fallback and run tests
        run: |
          python -c 'from perception_core.common.iou import resolve_iou_backend; assert resolve_iou_backend("auto") == "python"'
          pytest src/perception_core/tests -q

  lint:
    name: ruff lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ruff
      - run: ruff check --config src/perception_core/pyproject.toml src carla tools

  smoke:
    name: end-to-end smoke demo (headless)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ./src/perception_core matplotlib
      - name: Run the offline pipeline on a synthetic scenario
        run: python tools/run_demo.py --frames 20 --no-video --report /tmp/report.json
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: /tmp/report.json

  bench:
    name: latency budget + prediction metrics
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install ./src/perception_core
      - name: Latency benchmark (asserts a loose real-time budget)
        run: >-
          python tools/benchmark.py --detector gt --frames 80 --warmup 5
          --budget-ms 150 --report /tmp/latency.json
      - name: Prediction accuracy (ADE / FDE) on the analytic scenario bank
        run: python tools/eval_prediction.py --report /tmp/prediction.json
      - uses: actions/upload-artifact@v4
        with:
          name: bench-reports
          path: |
            /tmp/latency.json
            /tmp/prediction.json
