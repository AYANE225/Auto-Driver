name: Project website

on:
  push:
    branches: [main]
    paths:
      - "docs/index.html"
      - "docs/assets/**"
      - "docs/benchmarks/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Stage the static site and public benchmark reports
        run: |
          mkdir -p _site
          cp docs/index.html _site/
          cp -r docs/assets docs/benchmarks _site/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
