# Highway scenario: faster traffic, longer LiDAR range, no pedestrians.
town: Town04_Opt
unload_layers: [ParkedVehicles]
dt: 0.1
num_frames: 400
warmup_frames: 60
num_vehicles: 90
num_walkers: 0
tm_speed_difference: -10.0   # NPCs drive ~10 % above the speed limit
weather: ClearSunset
seed: 7
ego: vehicle.tesla.model3

lidar:
  channels: 64
  range: 100.0
  points_per_second: 1300000
  upper_fov: 10.0
  lower_fov: -25.0
  dropoff_general_rate: 0.2
  noise_stddev: 0.01
  z: 1.8

cameras:
  - name: front
    width: 1280
    height: 720
    fov: 75.0
    x: 1.5
    z: 1.6
    yaw: 0.0
