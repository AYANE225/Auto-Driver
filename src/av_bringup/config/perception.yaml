# Parameters for the AV perception bring-up. Loaded by both nodes; keys are
# grouped by node name as ROS 2 expects.

perception_node:
  ros__parameters:
    frame_id: "map"
    input_topic: "/lidar/points"
    dbscan_eps: 0.8
    ground_dist_thresh: 0.2
    tracker:
      iou_threshold: 0.1
      min_hits: 3
      max_age: 5
    prediction:
      horizon: 3.0
      step: 0.5

synthetic_publisher:
  ros__parameters:
    frame_id: "map"
    topic: "/lidar/points"
    rate: 10.0
    num_frames: 60
    dt: 0.1
    seed: 7
